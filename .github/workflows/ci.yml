name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-ind

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Run test suite
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: ci-test-secret-at-least-48-characters-long-for-security
          AUTO_MIGRATE: "true"
          UPLOAD_DIR: /tmp/strukku-uploads
        run: python -m pytest -q
